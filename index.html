<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The System</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07040f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The System">

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070f;--panel:#0b1124;--line:#1f3a7a;--blue:#4aa3ff;--glow:#2f6bff;--text:#dce8ff;--dim:#7d8db3;--red:#ff4d6a;--gold:#ffc857;--green:#3ddc97;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Rajdhani',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:17px}
main{max-width:560px;margin:0 auto;padding:14px}
.win{background:var(--panel);border:1px solid var(--line);box-shadow:0 0 18px rgba(47,107,255,.25),inset 0 0 22px rgba(47,107,255,.08);padding:16px;margin-bottom:14px}
h1{margin:0 0 4px;font-size:1.6rem;letter-spacing:.04em}
h2{margin:0 0 10px;font-size:1.15rem;color:var(--blue);border-bottom:1px solid var(--line);padding-bottom:6px}
.sub{color:var(--dim);font-size:.95rem}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{flex:1;height:5px;background:#0f1b3a}
.steps i.on{background:var(--blue);box-shadow:0 0 8px var(--glow)}
label{display:block;margin:12px 0 4px;color:var(--dim);font-size:.95rem}
input,select{width:100%;background:#070d1d;border:1px solid var(--line);color:var(--text);font:inherit;padding:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer}
.go{width:100%;margin-top:16px;background:var(--glow);border:0;color:#fff;font-weight:700;padding:12px;font-size:1.05rem}
.ghost{background:none;border:1px solid var(--line);color:var(--text);padding:10px 14px;margin-top:10px}
.chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{background:none;border:1px solid var(--line);color:var(--text);padding:6px 14px}
.chip.on{background:var(--blue);color:var(--bg);border-color:var(--blue)}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid #14213f}
.stat:last-child{border:0}
.stat b{font-size:1.25rem}
.big{font-size:3rem;font-weight:700;color:var(--blue);line-height:1;text-shadow:0 0 14px var(--glow)}
.warn{border:1px solid var(--red);color:#ffb3c0;padding:10px;margin-top:12px;font-size:.95rem}
.note{border:1px solid var(--line);color:var(--dim);padding:10px;margin-top:12px;font-size:.9rem}
.mac{margin:12px 0}
.mac .h{display:flex;justify-content:space-between}
.bar{height:10px;background:#0a1a3d;border:1px solid var(--line);margin-top:4px}
.bar i{display:block;height:100%}
table{width:100%;border-collapse:collapse}
td{padding:7px 0;border-bottom:1px solid #14213f}
td:last-child{text-align:right;color:var(--gold);font-weight:600}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px}
.rank{width:52px;height:52px;border:2px solid var(--blue);display:grid;place-items:center;font-size:1.6rem;font-weight:700;color:var(--blue);box-shadow:0 0 12px var(--glow);flex:none}
.dnav{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{flex:1;background:none;border:0;color:var(--dim);padding:8px 0;font-size:.85rem;display:flex;flex-direction:column;align-items:center}
.tabs button span{font-size:1.4rem}
.tabs button.on{color:var(--blue);box-shadow:inset 0 2px 0 var(--blue)}
.eq{display:flex;justify-content:space-between;text-align:center;align-items:center}
.eq div{display:flex;flex-direction:column}.eq b{font-size:1.3rem}.eq span{font-size:.8rem;color:var(--dim)}
.pos{color:var(--green)}.neg{color:var(--red)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #14213f}
.row:last-child{border:0}.row .n{flex:1;min-width:0;overflow-wrap:anywhere}
.chk{width:28px;height:28px;border:2px solid var(--blue);background:none;color:var(--blue);font-weight:700;flex:none}
.chk:disabled{opacity:.9}.done .chk{background:var(--blue);color:var(--bg)}.done .n{color:var(--dim)}
.xp{color:var(--gold);font-weight:600;white-space:nowrap}
.x{background:none;border:0;color:var(--dim);font-size:1.2rem;padding:4px 8px}
.sr{display:grid;grid-template-columns:48px 1fr 1fr 32px;gap:8px;align-items:center;margin-top:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.wh{display:flex;gap:8px}
body{padding-bottom:90px}
:root{--bg:#07040f;--panel:#100a22;--line:#4b2a9c;--blue:#b36bff;--glow:#7a2bff;--text:#f1e9ff;--dim:#9d8fc9;--red:#ff4d8a}
html{background:#07040f}
body{background:radial-gradient(ellipse at 50% -10%,#2b1066 0,transparent 55%) fixed,#07040f}
h1,h2{text-transform:uppercase;letter-spacing:.12em;text-shadow:0 0 12px rgba(179,107,255,.6)}
h1{font-size:1.5rem}
h2{border-bottom-color:rgba(179,107,255,.3)}
.win{position:relative;overflow:hidden;border:1px solid rgba(179,107,255,.35);border-radius:6px;background:linear-gradient(160deg,rgba(32,16,70,.92),rgba(14,8,32,.95));box-shadow:0 0 22px rgba(122,43,255,.28),inset 0 0 26px rgba(179,107,255,.07)}
.win::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent)}
input,select{background:#0c0720;border:1px solid #3b2380;border-radius:4px}
input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 10px rgba(179,107,255,.45)}
.go{background:linear-gradient(135deg,#7a2bff,#c04bff);border-radius:4px;box-shadow:0 0 16px rgba(122,43,255,.6);text-transform:uppercase;letter-spacing:.1em;transition:transform .15s}
.go:active{transform:scale(.97)}
.ghost,.chip{border-color:#4b2a9c;border-radius:4px;transition:.2s}
.chip.on{box-shadow:0 0 12px var(--blue)}
.chip:hover,.ghost:hover{border-color:var(--blue);box-shadow:0 0 10px rgba(179,107,255,.4)}
.rank{border-radius:6px;background:rgba(122,43,255,.15);text-shadow:0 0 12px var(--blue);animation:pulse 2.6s ease-in-out infinite}
.bar{background:#150c33;border-color:#3b2380;border-radius:6px;overflow:hidden}
.bar i{transform-origin:left;animation:fill .9s ease-out;box-shadow:0 0 10px var(--glow)}
.top .bar i{background:linear-gradient(90deg,#7a2bff,#e07bff,#7a2bff)!important;background-size:200% 100%;animation:fill .9s ease-out,flow 3s linear infinite}
.row,.stat,td{border-bottom-color:#2a1a55}
.steps i{background:#241447}.steps i.on{background:var(--blue);box-shadow:0 0 10px var(--glow)}
.chk{border-radius:4px}.done .chk{box-shadow:0 0 12px var(--blue);animation:pop .4s ease-out}
.tabs{background:rgba(12,6,28,.92);backdrop-filter:blur(10px);border-top-color:rgba(179,107,255,.4)}
.tabs button.on{text-shadow:0 0 10px var(--blue);box-shadow:inset 0 2px 0 var(--blue),0 -6px 14px -6px var(--glow)}
.note{border-radius:6px}
.note[style*="var(--blue)"]{font-size:1.25rem;font-weight:700;text-align:center;text-shadow:0 0 14px var(--blue);animation:lvl 1s ease-out}
svg polyline{stroke:var(--blue)}svg circle{fill:var(--blue)}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes flow{to{background-position:-200% 0}}
@keyframes pulse{50%{box-shadow:0 0 24px var(--blue)}}
@keyframes pop{50%{transform:scale(1.25)}}
@keyframes lvl{0%{transform:scale(.7);opacity:0}50%{transform:scale(1.06);box-shadow:0 0 40px var(--blue)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{background:radial-gradient(circle at 85% 8%,rgba(192,75,255,.22),transparent 40%),radial-gradient(circle at 8% 92%,rgba(60,90,255,.18),transparent 45%),radial-gradient(ellipse at 50% -10%,#2b1066 0,transparent 55%),#07040f;background-attachment:fixed;padding-bottom:115px}
.win{border-radius:20px;padding:18px;border:1px solid rgba(179,107,255,.22);background:linear-gradient(160deg,rgba(40,20,88,.75),rgba(16,9,38,.85));backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 28px rgba(122,43,255,.18);animation:up .55s ease both}
.win::before{height:1px}
.win:nth-child(2){animation-delay:.07s}.win:nth-child(3){animation-delay:.14s}.win:nth-child(4){animation-delay:.21s}.win:nth-child(5){animation-delay:.28s}
h2{font-size:.85rem;color:var(--dim);border-bottom:0;padding:0;margin-bottom:14px;letter-spacing:.2em}
.top .rank{width:60px;height:60px;border-radius:50%;font-size:1.9rem;background:radial-gradient(circle,#4a1fa8,#1b0b42)}
.dnav{background:rgba(122,43,255,.12);border-radius:999px;padding:4px}
.dnav .chip{width:38px;height:38px;border-radius:50%;padding:0;font-size:1.3rem}
.chip,.ghost{border-radius:999px;min-height:40px;padding:8px 16px}
.go{border-radius:16px;min-height:52px;font-size:1.05rem;letter-spacing:.12em}
input,select{border-radius:14px;min-height:48px;padding:12px 14px;font-size:1rem;background:rgba(10,5,26,.7)}
.bar{height:12px;border-radius:999px}.bar i{border-radius:999px}
.steps i{height:6px;border-radius:99px}
.stat{padding:12px 0}.eq b{font-size:1.15rem}
.xp{background:rgba(255,200,87,.12);border-radius:999px;padding:3px 10px;font-size:.85rem}
.row.mc,.row.mc:last-child{background:rgba(255,255,255,.035);border:1px solid rgba(179,107,255,.2);border-radius:16px;padding:12px;margin-bottom:10px;gap:12px}
.row.mc.done{background:linear-gradient(135deg,rgba(122,43,255,.3),rgba(192,75,255,.12));border-color:rgba(179,107,255,.6);box-shadow:0 0 16px rgba(122,43,255,.35)}
.ic{order:0;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:rgba(122,43,255,.25);flex:none}
.mc.done .ic{box-shadow:0 0 14px var(--glow)}
.mc .n{order:1;font-weight:600}.mc.done .n{color:var(--text)}.mc .xp{order:2}.mc .chk{order:3;width:32px;height:32px;border-radius:50%}
.tabs{max-width:540px;margin:0 auto;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:24px;border:1px solid rgba(179,107,255,.35);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 24px rgba(122,43,255,.3)}
.tabs button{border-radius:18px;transition:.25s;font-size:.78rem;letter-spacing:.04em}
.tabs button.on{background:rgba(122,43,255,.3);box-shadow:inset 0 0 0 1px rgba(179,107,255,.5),0 0 14px rgba(122,43,255,.4)}
.note{border-radius:16px}
.ringw{position:relative;width:170px;margin:4px auto 14px}.ringw svg{width:100%;display:block}
.ringw svg circle{fill:none}
.rg0{stroke:rgba(179,107,255,.15);stroke-width:9}
.rg1{stroke:var(--blue);stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--glow));animation:ringIn 1.1s ease-out}
.rg1.over{stroke:var(--red)}
.rgt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rgt b{font-size:2.2rem;line-height:1}.rgt span{font-size:.8rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
@keyframes ringIn{from{stroke-dasharray:0 400}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
var KEY='the-system-profile-v1',P={},step=0,app=document.getElementById('app');
try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.name){P=s;step=3}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function v(id){return document.getElementById(id)}
var ACT=[['Sedentary: desk job, little exercise',1.2],['Light: exercise 1 to 3 days a week',1.375],['Moderate: exercise 3 to 5 days a week',1.55],['Active: hard exercise 6 to 7 days a week',1.725],['Very active: physical job plus training',1.9]];
function bmi(w,h){return w/Math.pow(h/100,2)}
function bmiCat(b){return b<18.5?'Underweight':b<25?'Normal':b<30?'Overweight':'Obese'}
function bmr(p){return 10*p.w+6.25*p.h-5*p.age+(p.sex==='M'?5:-161)}
function maint(p){return Math.round(bmr(p)*ACT[p.act][1])}
function floor(p){return p.sex==='M'?1500:1200}
function plan(p){
  var m=maint(p),kc=m-p.def,pro=Math.round(1.8*p.tw),fat=Math.round(kc*.25/9),carb=Math.max(0,Math.round((kc-pro*4-fat*9)/4));
  return{m:m,kc:kc,pro:pro,fat:fat,carb:carb,fib:Math.round(kc/1000*14),water:(p.w*0.035).toFixed(1),wk:(p.def*7/7700)}
}
function micros(p){
  var M=p.sex==='M',a=p.age;
  return[
   ['Sodium (limit)','under 2,300 mg'],
   ['Potassium',(M?3400:2600)+' mg'],
   ['Calcium',((!M&&a>50)||(M&&a>70)?1200:1000)+' mg'],
   ['Iron',(M||a>50?8:18)+' mg'],
   ['Magnesium',(M?(a>30?420:400):(a>30?320:310))+' mg'],
   ['Zinc',(M?11:8)+' mg'],
   ['Vitamin A',(M?900:700)+' mcg'],
   ['Vitamin C',(M?90:75)+' mg'],
   ['Vitamin D',(a>70?20:15)+' mcg'],
   ['Vitamin E','15 mg'],
   ['Vitamin K',(M?120:90)+' mcg'],
   ['Vitamin B12','2.4 mcg'],
   ['Folate','400 mcg']
  ]
}
function head(n){return '<div class="steps">'+[0,1,2].map(function(i){return '<i class="'+(i<=n?'on':'')+'"></i>'}).join('')+'</div>'}
function render(){
  if(step===0)s0();else if(step===1)s1();else if(step===2)s2();else if(step===4)prof();else home();
  window.scrollTo(0,0);
}
function s0(){
  app.innerHTML=head(0)+'<div class="win"><h1>The System</h1><div class="sub">Step 1 of 3. Tell me about yourself.</div>'+
  '<form id="f"><label for="name">Name</label><input id="name" maxlength="30" required value="'+esc(P.name||'')+'">'+
  '<div class="two"><div><label for="age">Age</label><input id="age" type="number" min="14" max="100" required value="'+(P.age||'')+'"></div>'+
  '<div><label for="sex">Sex</label><select id="sex"><option value="M"'+(P.sex==='M'?' selected':'')+'>Male</option><option value="F"'+(P.sex==='F'?' selected':'')+'>Female</option></select></div></div>'+
  '<div class="two"><div><label for="h">Height (cm)</label><input id="h" type="number" min="100" max="250" step="0.1" required value="'+(P.h||'')+'"></div>'+
  '<div><label for="w">Weight (kg)</label><input id="w" type="number" min="30" max="300" step="0.1" required value="'+(P.w||'')+'"></div></div>'+
  '<div class="stat" style="margin-top:14px"><span class="sub">BMI (auto)</span><b id="bmi">–</b></div>'+
  '<button class="go">Next: set your goal</button></form></div>';
  function upd(){var h=+v('h').value,w=+v('w').value;v('bmi').textContent=(h>0&&w>0)?bmi(w,h).toFixed(1)+' · '+bmiCat(bmi(w,h)):'–'}
  v('h').oninput=upd;v('w').oninput=upd;upd();
  v('f').onsubmit=function(e){e.preventDefault();
    P.name=v('name').value.trim();P.age=+v('age').value;P.sex=v('sex').value;P.h=+v('h').value;P.w=+v('w').value;
    if(P.act==null)P.act=1;if(P.def==null)P.def=500;if(!P.tw)P.tw=Math.round(P.w-5);
    save();step=1;render()};
}
function s1(){
  app.innerHTML=head(1)+'<div class="win"><h1>Set your goal</h1><div class="sub">Step 2 of 3. Pick a target and a daily deficit.</div>'+
  '<form id="f"><label for="tw">Target weight (kg)</label><input id="tw" type="number" min="30" max="300" step="0.1" required value="'+P.tw+'">'+
  '<label for="act">Activity level</label><select id="act">'+ACT.map(function(a,i){return '<option value="'+i+'"'+(i===P.act?' selected':'')+'>'+a[0]+'</option>'}).join('')+'</select>'+
  '<div class="stat" style="margin-top:14px"><span class="sub">Maintenance calories</span><b id="m"></b></div>'+
  '<label for="def">Daily deficit (kcal below maintenance)</label><input id="def" type="number" min="0" max="1500" step="10" required value="'+P.def+'">'+
  '<div class="chips" id="chips">'+[250,500,750,1000].map(function(d){return '<button type="button" class="chip" data-d="'+d+'">'+d+'</button>'}).join('')+'</div>'+
  '<div class="stat" style="margin-top:14px"><span class="sub">Daily target</span><b id="t"></b></div>'+
  '<div class="stat"><span class="sub">Expected loss</span><b id="wk"></b></div><div id="msg"></div>'+
  '<button class="go">Next: see my plan</button></form><button class="ghost" id="back">Back</button></div>';
  function upd(){
    P.tw=+v('tw').value;P.act=+v('act').value;P.def=+v('def').value||0;var p=plan(P);
    v('m').textContent=p.m+' kcal';v('t').textContent=p.kc+' kcal';
    v('wk').textContent=(p.wk).toFixed(2)+' kg/week'+(P.w>P.tw&&p.wk>0?' · about '+Math.ceil((P.w-P.tw)/p.wk)+' weeks':'');
    [].forEach.call(document.querySelectorAll('.chip'),function(c){c.classList.toggle('on',+c.dataset.d===P.def)});
    var m='';if(P.tw>=P.w)m='<div class="warn">Your target weight should be below your current weight ('+P.w+' kg) for a deficit plan.</div>';
    else if(p.kc<floor(P))m='<div class="warn">This target is under '+floor(P)+' kcal, which is below the usual safe minimum. Try a smaller deficit.</div>';
    v('msg').innerHTML=m;
  }
  ['tw','act','def'].forEach(function(i){v(i).oninput=upd;v(i).onchange=upd});
  v('chips').onclick=function(e){if(e.target.dataset.d){v('def').value=e.target.dataset.d;upd()}};
  upd();
  v('back').onclick=function(){step=0;render()};
  v('f').onsubmit=function(e){e.preventDefault();upd();if(P.tw>=P.w)return;save();step=2;render()};
}
function s2(){
  var p=plan(P),b=bmi(P.w,P.h),low=p.kc<floor(P);
  function mac(n,g,kc,c){return '<div class="mac"><div class="h"><span>'+n+'</span><b>'+g+' g</b></div><div class="bar"><i style="width:'+Math.min(100,kc/p.kc*100)+'%;background:'+c+'"></i></div><div class="sub">'+Math.round(kc)+' kcal · '+Math.round(kc/p.kc*100)+'% of calories</div></div>'}
  app.innerHTML=head(2)+'<div class="win"><h1>'+esc(P.name)+'’s plan</h1><div class="sub">Step 3 of 3. Your daily targets.</div>'+
  '<div style="margin:16px 0"><div class="big">'+p.kc+'</div><div class="sub">kcal per day (maintenance '+p.m+' minus '+P.def+')</div></div>'+
  (low?'<div class="warn">This is under '+floor(P)+' kcal, below the usual safe minimum. Consider a smaller deficit.</div>':'')+
  '<div class="stat"><span class="sub">Now → target</span><b>'+P.w+' → '+P.tw+' kg</b></div>'+
  '<div class="stat"><span class="sub">BMI</span><b>'+b.toFixed(1)+' · '+bmiCat(b)+'</b></div>'+
  '<div class="stat"><span class="sub">Expected loss</span><b>'+p.wk.toFixed(2)+' kg/week</b></div></div>'+
  '<div class="win"><h2>Macros</h2>'+mac('Protein',p.pro,p.pro*4,'var(--blue)')+mac('Carbohydrates',p.carb,p.carb*4,'var(--gold)')+mac('Fat',p.fat,p.fat*9,'var(--green)')+
  '<div class="stat"><span class="sub">Fibre</span><b>'+p.fib+' g</b></div><div class="stat"><span class="sub">Water</span><b>'+p.water+' L</b></div></div>'+
  '<div class="win"><h2>Micronutrients (daily)</h2><table>'+micros(P).map(function(r){return '<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>'}).join('')+'</table>'+

  '<button class="go" id="st">Start my missions</button><button class="ghost" id="e1">Edit goal</button> <button class="ghost" id="e0">Edit my details</button> <button class="ghost" id="rs">Start over as a new user</button>';

  b.innerHTML='<div class="win"><h2>Weight progress</h2><div class="eq"><div><b>'+w0+'</b><span>Start</span></div><div><b>'+cur+'</b><span>Now</span></div><div><b>'+tw+'</b><span>Target</span></div></div><div class="bar" style="margin-top:12px"><i style="width:'+pc+'%;background:var(--blue)"></i></div><div class="sub">'+Math.round(pc)+'% of the way · '+(cur>tw?(cur-tw).toFixed(1)+' kg to go':'Target reached!')+'</div>'+chart(pts,tw)+'</div>'+
  '<div class="win"><h2>Weigh in</h2><form id="wf2"><input id="wv" type="number" step="0.1" min="30" max="300" required placeholder="Weight for this day (kg)" aria-label="Weight in kg"><button class="go">Save weight</button></form><div class="sub" style="margin:8px 0">Your calorie target follows your latest weight: now '+plan(P).kc+' kcal. '+(wdue()<=tk()?'Weekly weigh-in is due now.':'Next weigh-in due '+wdue()+'.')+'</div>'+
  Object.keys(D.wt).sort().reverse().slice(0,7).map(function(k){return '<div class="row"><div class="n">'+k+'</div><span class="xp">'+D.wt[k]+' kg</span><button class="x" data-dw="'+k+'" aria-label="Delete weight">×</button></div>'}).join('')+'</div>';
  v('wf2').onsubmit=function(e){e.preventDefault();D.wt[day]=+v('wv').value;P.w=lw();save();sv();home()};
  b.onclick=function(e){var k=e.target.dataset.dw;if(!k)return;delete D.wt[k];P.w=lw();save();sv();home()};
}
render();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js')}catch(e){}})}</script>
</body>
